name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hris
          POSTGRES_PASSWORD: hris_dev_password
          POSTGRES_DB: hris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hris -d hris"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hris:hris_dev_password@127.0.0.1:5432/hris
      DATABASE_SSL: "false"
      JWT_SECRET: ci-only-secret-please-rotate-in-production-0123456789
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed demo data
        run: npm run db:seed

      - name: Typecheck (API + web)
        run: npm run typecheck

      - name: Lint (web)
        run: npm run lint

      - name: Unit test with coverage
        run: npm run test:coverage --workspace api

      - name: Build (API + web)
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore
